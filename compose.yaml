services:
  weekly-poll-bot:
    build: .
    container_name: weekly-poll-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - weekly-poll-state:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  weekly-poll-state:
